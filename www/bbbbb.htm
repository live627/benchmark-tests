<!DOCTYPE html>
<html>
    <head>
        <title>Upload</title>
<link rel="stylesheet" media="screen" href="bbbbb.css" />
        <script src="http://code.jquery.com/jquery-2.1.3.min.js"></script>
    </head>
    <body>
        <form method="POST" action="upload.php" enctype='multipart/form-data'>
            <input type="file" name="fileToUpload" id="file"><br />
            <div id="drop_zone">Drop files here</div>
<output id="list"></output>
            <input type="submit" id="submit">
        </form>

<h2>Radial Progress</h2>
<h3>Change data-percent attribute</h3>
<div class="progresscontainder">
<div class="progressdiv" data-percent="55">
  <svg class="progress" width="178" height="178" viewport="0 0 100 100" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <circle r="80" cx="89" cy="89" fill="transparent" ></circle>
    <circle class="bar" r="80" cx="89" cy="89" fill="transparent" stroke-dasharray="502.4" stroke-dashoffset="0"></circle>
  </svg></div></div>
    </body>

<script>
(function () {
  window.onload = function () {
    const circles = document.querySelectorAll(".progressdiv");
    for (var i = 0; i < circles.length; i++) {
      var bar = circles[i].querySelector(".bar",
      totalProgress = bar.getAttribute("stroke-dasharray"),
      progress = circles[i].getAttribute("data-percent");

      bar.style["stroke-dashoffset"] = (totalProgress * progress) / 100;
    }
  };
})();

  function handleFileSelect(evt) {
    evt.stopPropagation();
    evt.preventDefault();

    var files = evt.dataTransfer.files; // FileList object.

    // files is a FileList of File objects. List some properties.
    var output = [];
    for (var i = 0, f; f = files[i]; i++) {
      output.push('<li><strong>', escape(f.name), '</strong> (', f.type || 'n/a', ') - ',
                  f.size, ' bytes, last modified: ',
                  f.lastModifiedDate ? f.lastModifiedDate.toLocaleDateString() : 'n/a',
                  '</li>');
    }
    document.getElementById('list').innerHTML = '<ul>' + output.join('') + '</ul>';
  }

  function handleDragOver(evt) {
    evt.stopPropagation();
    evt.preventDefault();
    evt.dataTransfer.dropEffect = 'copy'; // Explicitly show this is a copy.
  }

  // Setup the dnd listeners.
  var
  acceptedTypes = {
    "image/png": true,
    "image/jpeg": true,
    "image/gif": true
  },
  progress = document.getElementById("uploadprogress"),
  fileupload = document.getElementById("upload");
  var dropZone = document.createElement("div");
  dropZone.addEventListener('dragover', handleDragOver, false);
  dropZone.addEventListener('drop', handleFileSelect, false);
  dropZone.className = "hidden";
  document.body.insertBefore(dropZone, fileupload); 

function previewfile(file) {
  var thisFile = document.createElement("div");
  document.body.insertBefore(thisFile, fileupload); 
  if (acceptedTypes[file.type] === true) {
    var reader = new FileReader();
    reader.onload = function (event) {
      var image = new Image();
      image.src = event.target.result;
      image.width = 250; // a fake resize
      holder.appendChild(image);
    };

    reader.readAsDataURL(file);
  } else {
    holder.innerHTML +=
      "<p>Uploaded " +
      file.name +
      " " +
      (file.size ? ((file.size / 1024) | 0) + "K" : "");
    console.log(file);
  }
}

function readfiles(files) {
  var formData = new FormData();
  for (var i = 0; i < files.length; i++) {
    formData.append("file", files[i]);
    previewfile(files[i]);
  }

  // now post a new XHR request
    var xhr = new XMLHttpRequest();
    xhr.open("POST", "/devnull.php");
    xhr.onload = function () {
      progress.value = progress.innerHTML = 100;
    };

      xhr.upload.onprogress = function (event) {
        if (event.lengthComputable) {
          var complete = ((event.loaded / event.total) * 100) | 0;
          progress.value = progress.innerHTML = complete;
        }
      };

    xhr.send(formData);
  }
    </script>
</html>
